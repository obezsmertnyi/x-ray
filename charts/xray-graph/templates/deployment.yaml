{{- /* ephemeral is an emptyDir that starts empty on every pod start, so it is
       always seeded from the maps image; seed.enabled only adds images. One
       flag for "does the seed initContainer render" keeps the two in step. */ -}}
{{- $ephemeral := eq .Values.snapshots.source "ephemeral" -}}
{{- $seed := or .Values.snapshots.seed.enabled $ephemeral -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xray-graph.fullname" . }}
  labels:
    {{- include "xray-graph.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.server.writable }}
  # A writable snapshot directory is edited in place and flushed back on
  # eviction and shutdown, so two replicas would flush over each other on a
  # PVC; on an emptyDir a rolling update would briefly answer `recall` from
  # two pods holding different notes. Either way: never two at once.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "xray-graph.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xray-graph.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "xray-graph.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.embeddings.sidecar.enabled $seed }}
      initContainers:
      {{- end }}
      {{- if .Values.embeddings.sidecar.enabled }}
        # Native embedding sidecar: an initContainer with restartPolicy: Always
        # runs for the pod's whole life, but unlike a regular container it is
        # started first AND its startupProbe must pass before anything after it
        # starts. That is the guarantee wanted here — llama.cpp has the model
        # loaded before the seed runs and before the server takes its first
        # search — so there is no "embed failed" race at startup. Listed first
        # for exactly that reason. The model is baked into the image
        # (embeddings.sidecar.modelPath), so nothing is fetched at start.
        - name: embedder
          image: {{ .Values.embeddings.sidecar.image }}
          imagePullPolicy: {{ .Values.embeddings.sidecar.pullPolicy }}
          restartPolicy: Always
          args:
            {{- include "xray-graph.embedderArgs" . | nindent 12 }}
          ports:
            - name: embed
              containerPort: {{ .Values.embeddings.sidecar.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: embed
            periodSeconds: {{ .Values.embeddings.sidecar.startupPeriodSeconds | default 5 }}
            failureThreshold: {{ .Values.embeddings.sidecar.startupFailureThreshold | default 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: embed
            periodSeconds: 10
          resources:
            {{- toYaml .Values.embeddings.sidecar.resources | nindent 12 }}
      {{- end }}
      {{- if $seed }}
        # Seed a fresh volume from OCI images holding *.graph.gob.gz. Each image
        # is mounted as an image volume under /seed/<n> (the kubelet mounts the
        # image's root filesystem, read-only), and `find` walks all of them so a
        # per-image path needs no shell arithmetic. Copy only what the volume
        # lacks (unless seed.overwrite): the volume is where update_code_graph's
        # worked copies and `remember`'s notes are flushed, and a redeploy must
        # not erase them. Each file lands under a temporary name and is renamed
        # into place, so a partial copy never looks like a snapshot. One log
        # line per file, so `kubectl logs -c seed` says what happened.
        #
        # With snapshots.source=ephemeral the maps image itself is mounted at
        # /seed/maps and walked by the same loop, so snapshots.image keeps
        # meaning "the maps image" in both modes; the emptyDir is empty at every
        # start, so the skip branch never fires there and overwrite is moot.
        - name: seed
          image: "{{ .Values.snapshots.seed.image.repository }}:{{ .Values.snapshots.seed.image.tag }}"
          imagePullPolicy: {{ .Values.snapshots.seed.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              copied=0; skipped=0
              for f in $(find /seed -name '*.graph.gob.gz' | sort); do
                b=$(basename "$f")
                if [ -e "/out/$b" ] && [ "$SEED_OVERWRITE" != "true" ]; then
                  echo "seed: skip $b (already on the volume)"
                  skipped=$((skipped+1))
                  continue
                fi
                cp "$f" "/out/.$b.seed" && mv "/out/.$b.seed" "/out/$b"
                echo "seed: copied $b from $f"
                copied=$((copied+1))
              done
              echo "seed: done copied=$copied skipped=$skipped"
          env:
            - name: SEED_OVERWRITE
              value: {{ .Values.snapshots.seed.overwrite | quote }}
          volumeMounts:
            - name: maps
              mountPath: /out
            {{- if $ephemeral }}
            - name: seed-maps
              mountPath: /seed/maps
              readOnly: true
            {{- end }}
            {{- if .Values.snapshots.seed.enabled }}
            {{- range $i, $img := .Values.snapshots.seed.images }}
            - name: seed-{{ $i }}
              mountPath: /seed/{{ $i }}
              readOnly: true
            {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "xray-graph.args" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- if .Values.startupProbeEnabled }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbeEnabled }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbeEnabled }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or .Values.extraEnv .Values.snapshots.encryption.enabled .Values.server.auth.enabled }}
          env:
            {{- if .Values.snapshots.encryption.enabled }}
            # The age identity that opens encrypted snapshots, as a path: the
            # server reads the file, so the secret never appears in args.
            - name: XRAY_SNAPSHOT_KEY
              value: {{ .Values.snapshots.encryption.mountPath | quote }}
            {{- end }}
            {{- if .Values.server.auth.enabled }}
            # The bearer token, as a path for the same reason as the key.
            - name: XRAY_AUTH_TOKEN_FILE
              value: {{ .Values.server.auth.mountPath | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: maps
              mountPath: {{ .Values.snapshots.mountPath }}
              readOnly: {{ not .Values.server.writable }}
              {{- if eq .Values.snapshots.source "image" }}
              # An image volume is the image's ROOT filesystem; subPath selects
              # the directory the snapshots were COPY'd into (image volumes
              # support subPath from Kubernetes 1.33).
              subPath: {{ .Values.snapshots.image.path | trimPrefix "/" | quote }}
              {{- end }}
            {{- if .Values.snapshots.encryption.enabled }}
            - name: snapshot-key
              mountPath: {{ .Values.snapshots.encryption.mountPath }}
              subPath: {{ .Values.snapshots.encryption.secretKey }}
              readOnly: true
            {{- end }}
            {{- if .Values.server.auth.enabled }}
            - name: auth-token
              mountPath: {{ .Values.server.auth.mountPath }}
              subPath: {{ .Values.server.auth.secretKey }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: maps
          {{- if eq .Values.snapshots.source "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "xray-graph.pvcName" . }}
          {{- else if $ephemeral }}
          # Fresh on every pod start and filled by the seed initContainer from
          # the maps image below. Writable without a PVC, at the price that
          # worked copies and `remember` notes go with the pod. `emptyDir: {}`
          # is spelled out because a bare `emptyDir:` renders as null and the
          # volume then has no source.
          {{- if or .Values.snapshots.ephemeral.sizeLimit .Values.snapshots.ephemeral.medium }}
          emptyDir:
            {{- with .Values.snapshots.ephemeral.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
            {{- with .Values.snapshots.ephemeral.medium }}
            medium: {{ . }}
            {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- else }}
          # The maps image mounted as an OCI image volume: the kubelet pulls it
          # and mounts its filesystem read-only, so the maps image needs no cp
          # and no shell (FROM scratch is fine), there is no copy step and no
          # size limit, and the mount is immutable. Pull secrets come from the
          # pod's imagePullSecrets and the service account, as for containers.
          # Needs Kubernetes >= 1.33 (see Chart.yaml kubeVersion).
          image:
            reference: "{{ .Values.snapshots.image.repository }}:{{ .Values.snapshots.image.tag }}"
            pullPolicy: {{ .Values.snapshots.image.pullPolicy }}
          {{- end }}
        {{- if $ephemeral }}
        # The maps image, mounted read-only for the seed to copy from — the
        # same image `source: image` would mount as the volume itself.
        - name: seed-maps
          image:
            reference: "{{ .Values.snapshots.image.repository }}:{{ .Values.snapshots.image.tag }}"
            pullPolicy: {{ .Values.snapshots.image.pullPolicy }}
        {{- end }}
        {{- if .Values.snapshots.seed.enabled }}
        {{- range $i, $img := .Values.snapshots.seed.images }}
        - name: seed-{{ $i }}
          image:
            reference: {{ required "snapshots.seed.images[].reference is required" $img.reference | quote }}
            pullPolicy: {{ $img.pullPolicy | default "IfNotPresent" }}
        {{- end }}
        {{- end }}
        {{- if .Values.snapshots.encryption.enabled }}
        # The identity only. The seed initContainer does not mount it: seeding
        # copies bytes, and an encrypted snapshot copies like any other file.
        - name: snapshot-key
          secret:
            secretName: {{ required "snapshots.encryption.secretName is required when encryption is enabled" .Values.snapshots.encryption.secretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.snapshots.encryption.secretKey }}
                path: {{ .Values.snapshots.encryption.secretKey }}
        {{- end }}
        {{- if .Values.server.auth.enabled }}
        - name: auth-token
          secret:
            secretName: {{ required "server.auth.secretName is required when auth is enabled" .Values.server.auth.secretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.server.auth.secretKey }}
                path: {{ .Values.server.auth.secretKey }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
