{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "xray-graph.serviceAccountName" . }}
  labels:
    {{- include "xray-graph.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server reads snapshots off a volume and talks to one HTTP endpoint. It
# calls no Kubernetes API, so the token is not projected.
automountServiceAccountToken: false
{{- end }}
