{{/*
Combinations the server cannot honour, refused at render time rather than
discovered as a crashloop or as two pods overwriting each other's snapshots.
This file intentionally renders no object.
*/}}

{{- if not (has .Values.snapshots.source (list "image" "pvc" "ephemeral")) }}
{{- fail (printf "snapshots.source must be \"image\", \"pvc\" or \"ephemeral\", got %q" .Values.snapshots.source) }}
{{- end }}

{{- if .Values.server.writable }}
  {{- if not (has .Values.snapshots.source (list "pvc" "ephemeral")) }}
    {{- fail "server.writable=true needs a volume the server can flush to, and snapshots.source=image is a read-only image mount — nothing written there lands anywhere. Set snapshots.source=pvc (notes and worked copies survive a pod restart) or snapshots.source=ephemeral (an emptyDir seeded from the maps image at every start; notes live as long as the pod)" }}
  {{- end }}
  {{- /* One rule for both storage kinds, with a different failure each: on a
        PVC every replica flushes its own worked copy into the same file and
        the last writer wins; on an emptyDir every replica keeps its own notes
        and `recall` answers from whichever pod took the call. */ -}}
  {{- if .Values.autoscaling.enabled }}
    {{- fail "server.writable=true is single-replica: on a PVC replicas flush over each other's worked copies and notes, on an emptyDir each replica keeps its own notes and recall answers from whichever pod took the call. Disable autoscaling or set server.writable=false" }}
  {{- end }}
  {{- if gt (int .Values.replicaCount) 1 }}
    {{- fail "server.writable=true is single-replica: on a PVC replicas flush over each other's worked copies and notes, on an emptyDir each replica keeps its own notes and recall answers from whichever pod took the call. Set replicaCount=1 or server.writable=false" }}
  {{- end }}
{{- end }}

{{- if .Values.snapshots.seed.enabled }}
  {{- if not (has .Values.snapshots.source (list "pvc" "ephemeral")) }}
    {{- fail "snapshots.seed.enabled=true needs snapshots.source=pvc or ephemeral — with source=image the maps image IS the mounted volume, so there is nothing to seed" }}
  {{- end }}
  {{- /* Under ephemeral the maps image is already seeded implicitly; enabling
        seed only adds images, so an empty list is a misconfiguration there
        too — the same check covers both sources. */ -}}
  {{- if empty .Values.snapshots.seed.images }}
    {{- fail "snapshots.seed.enabled=true but snapshots.seed.images names no OCI image to seed from" }}
  {{- end }}
{{- end }}

{{- if and .Values.embeddings.sidecar.enabled (not .Values.embeddings.sidecar.image) }}
{{- fail "embeddings.sidecar.enabled=true needs embeddings.sidecar.image — a llama.cpp server image with the embedding GGUF baked in at embeddings.sidecar.modelPath; this chart names no registry" }}
{{- end }}

{{- if and .Values.embeddings.sidecar.enabled (ne (int .Values.embeddings.dims) 256) (not .Values.embeddings.sidecar.allowOtherDims) }}
{{- fail (printf "embeddings.sidecar.enabled=true with embeddings.dims=%d — the sidecar serves nomic-embed-text and every shipped snapshot was built at dims 256; a different dims rejects them all at load. Set embeddings.sidecar.allowOtherDims=true only for snapshots you built at that truncation" (int .Values.embeddings.dims)) }}
{{- end }}

{{- if lt (int .Values.embeddings.dims) 1 }}
{{- fail "embeddings.dims must be positive and must match the dims the snapshots were built with — a mismatch is a hard rejection at load" }}
{{- end }}

{{- if and .Values.snapshots.encryption.enabled (not .Values.snapshots.encryption.secretName) }}
{{- fail "snapshots.encryption.enabled=true needs snapshots.encryption.secretName — the Secret holding the age identity (xray graph keygen; kubectl create secret generic <name> --from-file=identity=snapshot.key)" }}
{{- end }}

{{- if and .Values.server.auth.enabled (not .Values.server.auth.secretName) }}
{{- fail "server.auth.enabled=true needs server.auth.secretName — the Secret holding the bearer token (openssl rand -hex 32 > token; kubectl create secret generic <name> --from-file=token=token)" }}
{{- end }}
