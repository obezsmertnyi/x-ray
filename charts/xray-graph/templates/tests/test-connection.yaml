apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "xray-graph.fullname" . }}-test"
  labels:
    {{- include "xray-graph.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: curlimages/curl:8.11.1
      {{- if .Values.server.auth.enabled }}
      env:
        - name: XRAY_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.server.auth.secretName }}
              key: {{ .Values.server.auth.secretKey }}
      {{- end }}
      # /status proves more than /healthz: it fails the test when the server is
      # up but registered no maps.
      command:
        - sh
        - -c
        - |
          set -eu
          host="{{ include "xray-graph.fullname" . }}:{{ .Values.service.port }}"
          curl -sf "http://$host/healthz" > /dev/null
          {{- if .Values.server.auth.enabled }}
          curl -sf -H "Authorization: Bearer $XRAY_AUTH_TOKEN" "http://$host/status" | grep -q '"label"'
          {{- else }}
          curl -sf "http://$host/status" | grep -q '"label"'
          {{- end }}
