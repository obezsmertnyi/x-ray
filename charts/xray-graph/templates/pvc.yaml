{{- if and (eq .Values.snapshots.source "pvc") (not .Values.snapshots.pvc.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "xray-graph.pvcName" . }}
  labels:
    {{- include "xray-graph.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.snapshots.pvc.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.snapshots.pvc.size }}
  {{- with .Values.snapshots.pvc.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
