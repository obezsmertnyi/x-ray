apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
  {{- if .Values.workloadIdentity.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.workloadIdentity.gcpServiceAccount }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-secret-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
rules:
  # Secrets: list/watch are required and CANNOT be narrowed.
  # The app discovers arbitrary-named MCP token secrets (mcpServers[].tokenSecret)
  # at session time via a controller-runtime cache informer, which LISTs and
  # WATCHes Secrets. Kubernetes RBAC cannot scope list/watch by resourceNames
  # (only get/update/patch/delete support it), so this rule grants list/watch on
  # ALL Secrets in the namespace.
  #
  # SECURITY REQUIREMENT: deploy xray into a DEDICATED namespace. In a shared
  # namespace this Role can read every workload's Secrets — cross-workload
  # exposure. With a dedicated namespace the only Secrets present are xray's
  # own (OAuth creds + MCP tokens), so namespace-scoped access is least-privilege
  # in practice. Set .Values.namespace to a namespace owned solely by this release.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["xray.triageagent.dev"]
    resources: ["memorycells"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["xray.triageagent.dev"]
    resources: ["memorycells/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-secret-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Values.namespace }}
