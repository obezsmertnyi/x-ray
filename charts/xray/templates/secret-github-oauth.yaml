{{- if .Values.github.secretName }}
# This Secret must be created manually before deploying:
#   kubectl create secret generic {{ .Values.github.secretName }} -n {{ .Values.namespace }} \
#     --from-literal=GITHUB_CLIENT_ID=<your-client-id> \
#     --from-literal=GITHUB_CLIENT_SECRET=<your-client-secret>
#
# This template is intentionally empty — it documents the expected secret shape
# but does not create it (secrets with credentials should not be in Helm values).
{{- end }}
