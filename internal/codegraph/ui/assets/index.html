  searchError = null
  updateSearchStatus()
  let results
  try {
    results = await searchGraph(q)
  } catch (e) {
    if (seq !== searchSeq) return
    console.warn("search failed:", e)
    searchPending = false
    // Deliberately do NOT touch searchQuery/serverHits or call build() here —
    // the currently drawn graph (the last GOOD render) stays exactly as it
    // was; only the visible status changes. Falling back to a client-side
    // substring scan here would hide the fact that real search is broken
    // behind results that look like they came from search.
    searchError = (e && e.message) || String(e)
    updateSearchStatus()
    return
  }
  if (seq !== searchSeq) return // superseded by a newer query — discard
  dismissActivePanel()
  searchQuery = val
  serverHits = Array.isArray(results) ? results : []
  serverHitRank = new Map(serverHits.map((h, i) => [h.qn, i]))
  searchPending = false
  updateSearchStatus()
  build()
  refreshMetrics() // this query's own contribution to the search HUD, without waiting for the next poll tick
}

// updateSearchStatus renders the one visible line next to the search box:
// pending, a failure (kept until the next successful search — see runSearch),
// or the ranked hit count. Idle (no query, no error) clears it.
function updateSearchStatus() {
  searchStatusEl.classList.toggle("error", !!searchError)
  if (searchError) searchStatusEl.textContent = "search failed: " + searchError
  else if (searchPending) searchStatusEl.textContent = "searching…"
  else if (searchQuery.trim() && serverHits.length) searchStatusEl.textContent = serverHits.length + " ranked hit" + (serverHits.length === 1 ? "" : "s")
  else if (searchQuery.trim()) searchStatusEl.textContent = "no hits"
  else searchStatusEl.textContent = ""
}



document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return
  hideTip()
  if (activePanel) closePanel(activePanel)
})

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) }
// Tiny markdown: headings, bold, inline code, fenced blocks, paragraphs. Enough
// for ADR/README sections without pulling a markdown lib into the offline bundle.
//
// Fenced-block lines are collected into their own buffer (codeBuf) and joined
// with a real "\n" when the fence closes — NOT pushed one-per-line straight
// into `out`, which is joined with "" at the end. Pushing per-line into `out`
// silently dropped every newline inside a fence (a `<pre>` preserves literal
// "\n" characters via CSS white-space, but there were none left to preserve —
// esc(ln) strips the newline that String.split("\n") already consumed, and
// nothing added it back), so a multi-line fenced block rendered as one
// run-on line. Indented (4-space) blocks aren't given special <pre> treatment
// either before or after this fix — they fall through to the paragraph path
// below, which already preserves line breaks as <br> (just not monospace
// alignment); inline `` `code` `` only ever goes through inline(), untouched
// by this change.
function miniMarkdown(src) {
  const lines = String(src).split("\n"); let out = [], inCode = false, buf = [], codeBuf = []
  const flush = () => { if (buf.length) { out.push("<p>" + buf.join("<br>") + "</p>"); buf = [] } }
  const flushCode = () => { out.push("<pre>" + codeBuf.join("\n") + "</pre>"); codeBuf = [] }
  for (const ln of lines) {
    if (ln.trim().startsWith("```")) {
      if (inCode) { flushCode(); inCode = false } else { flush(); inCode = true }
      continue
    }
    if (inCode) { codeBuf.push(esc(ln)); continue }
    const h = ln.match(/^(#{1,3})\s+(.*)/)
    if (h) { flush(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue }
    if (ln.trim() === "") { flush(); continue }
    buf.push(inline(ln))
  }
  flush(); if (inCode) flushCode()
  return out.join("")
}
function inline(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>") }

// ── Live hit stream ───────────────────────────────────────────────────────────
// GET /ws lights up nodes as an agent actually touches them — one JSON text
// frame per event, {type:"hit"|"change", data:{...}}. This is a visualization
// layered on TOP of the graph, never a data source anything else here reads,
// so every failure mode has to fade into nothing rather than announce itself:
// an older snapshot-server binary with no /ws route at all (a plain 404 on
// the upgrade), a connection dropping mid-session, a malformed frame, or a
// host with no HTTP origin at all (the MCP App iframe) must all leave the
// rest of the page working exactly as it does today.
const WS_BACKOFF_MIN_MS = 1000
const WS_BACKOFF_MAX_MS = 30000
const HIT_WINDOW_MS = 10000   // "recent" in the HUD row means "in the last 10s", not "ever"
let wsBackoffMs = WS_BACKOFF_MIN_MS
let ws = null
let streamState = "connecting"
let hitTimestamps = []

function connectStream() {
  if (typeof WebSocket === "undefined") return
  if (inHost) return // sandboxed MCP host iframe — no HTTP origin to dial
  if (location.protocol !== "http:" && location.protocol !== "https:") return // e.g. a file:// preview
  setInterval(updateStreamHud, 2000) // ages the rolling hit count back down between hits
  updateStreamHud()
  openSocket()
}

function openSocket() {
  let sock
  try {
    const proto = location.protocol === "https:" ? "wss:" : "ws:"
    sock = new WebSocket(proto + "//" + location.host + "/ws")
  } catch (e) {
    scheduleReconnect() // construction itself can throw in some sandboxes — treat like any other drop
    return
  }
  ws = sock
  sock.onopen = () => {
    wsBackoffMs = WS_BACKOFF_MIN_MS // a successful connection forgives past failures
    streamState = "live"
    updateStreamHud()
  }
  sock.onmessage = (ev) => {
    let msg
    try { msg = JSON.parse(ev.data) } catch (e) { return } // one bad frame must never take the socket down
    if (!msg || typeof msg !== "object") return
    if (msg.type === "hit") handleHitFrame(msg.data)
    else if (msg.type === "change") handleChangeFrame(msg.data)
  }
  // onerror carries no diagnostic detail by spec and is always followed by
  // onclose, so the reconnect lives there alone — retrying from both would
  // double the attempt rate.
  sock.onerror = () => {}
  sock.onclose = () => {
    ws = null
    streamState = "retrying"
    updateStreamHud()
    scheduleReconnect()
  }
}

// scheduleReconnect is what keeps a permanently-404ing /ws (an older server
// binary) from ever becoming a tight loop: each attempt doubles the wait, capped.
function scheduleReconnect() {
  const delay = wsBackoffMs
  wsBackoffMs = Math.min(WS_BACKOFF_MAX_MS, wsBackoffMs * 2)
  setTimeout(openSocket, delay)
}

// A hit frame is the only thing that lights the graph: resolve its names to
// regions and let flashRegions do the rest. The counter moves even when nothing
// on screen matched, so "a hit arrived but nothing was drawn for it" stays
// distinguishable from "no hit arrived".
function handleHitFrame(data) {
  if (!data) return
  const qns = Array.isArray(data.qns) ? data.qns.filter(q => typeof q === "string" && q) : []
  if (!qns.length) return
  flashRegions(qns, Array.isArray(data.kinds) ? data.kinds : [])
  recordHits(qns.length)
}

// qnPath strips the repo prefix and any ::Symbol, leaving the repo-relative path
// a File node is keyed by.
function qnPath(qn) {
  const cut = qn.indexOf("//")
  const rest = cut === -1 ? qn : qn.slice(cut + 2)
  const sym = rest.indexOf("::")
  return sym === -1 ? rest : rest.slice(0, sym)
}

// An update frame's paths are namespaced or absolute while node names are
// repo-relative, so match on a "/"-bounded suffix: "foo.go" must not match
// "otherfoo.go".
function pathSuffixMatch(rel, p) { return p === rel || p.endsWith("/" + rel) }

function handleChangeFrame(data) {
  if (!data || !Array.isArray(data.paths) || !data.paths.length) return
  const drawn = window.__drawnNodes || []
  const touched = []
  for (const n of drawn) {
    if (n.kind !== "File") continue
    const rel = qnPath(n.qn)
    if (data.paths.some(p => typeof p === "string" && pathSuffixMatch(rel, p))) touched.push(n.qn)
  }
  if (touched.length) flashRegions(touched, [])
}

// ── Region flash ──────────────────────────────────────────────────────────
// Ported from the reference memory graph (xray-ui components/memory-graph.tsx):
// the ring on a single dot is an attention spike, not the signal. The signal is
// the REGION — the whole category a hit landed in lights up and dims back down
// over HIT_FADE_MS, so a hit is still legible seconds after its ring finished,
// and a hit whose node is not drawn still has somewhere to show itself.
//
// Once per DISTINCT category, never once per hit: five hits in one region must
// read as one pulse rather than five stacked transitions saturating it solid.
const HIT_FADE_MS = 20000
const CELL_BASE_OPACITY = 0.28     // matches the cells' resting fill-opacity in build()
const REGION_FLASH_OPACITY = 0.7   // below the direct 0.85, so a drawn hit still reads stronger
const DIRECT_FLASH_OPACITY = 0.85

function flashRegions(qns, kinds) {
  // Same suppression as the ring: nothing new lights up while the stats lens
  // is being read (see showTip).
  if (lensActive()) return
  const cells = window.__cellSel
  if (!cells) return

  const direct = new Set(qns)
  const cats = new Set()
  const drawn = window.__drawnNodes || []
  qns.forEach((qn, i) => {
    const node = drawn.find(n => n.qn === qn)
    const kind = node ? node.kind : (kinds && i < kinds.length ? kinds[i] : null)
    if (kind) cats.add(categoryOf(kind).id)
  })
  if (!cats.size) return

  // Reduced motion still gets the highlight — it is information, not decoration
  // — but as a step that clears after a few seconds rather than a long fade.
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches
  const dur = reduce ? 0 : HIT_FADE_MS
  const delay = reduce ? 4000 : 0

  cells.filter(d => direct.has(d.qn)).each(function (d) {
    const color = categoryOf(d.kind).color
    d3.select(this).interrupt()
      .attr("fill-opacity", DIRECT_FLASH_OPACITY)
      .attr("stroke-width", 3)
      .style("filter", `drop-shadow(0 0 18px ${color}) drop-shadow(0 0 6px ${color})`)
      .transition().delay(delay).duration(dur).ease(d3.easeCubicOut)
      .attr("fill-opacity", CELL_BASE_OPACITY)
      .attr("stroke-width", 1)
      .style("filter", null)
  })

  cells.filter(d => !direct.has(d.qn) && cats.has(categoryOf(d.kind).id)).each(function (d) {
    const color = categoryOf(d.kind).color
    d3.select(this).interrupt()
      .attr("fill-opacity", REGION_FLASH_OPACITY)
      .style("filter", `drop-shadow(0 0 12px ${color})`)
      .transition().delay(delay).duration(dur).ease(d3.easeCubicOut)
      .attr("fill-opacity", CELL_BASE_OPACITY)
      .style("filter", null)
  })

  // The dots are the hit itself: the one that was returned goes solid and
  // oversized, the rest of its region lifts halfway. Both decay on the same
  // clock as the cells, so the whole region settles as one.
  const dots = window.__dotSel
  if (dots) {
    dots.filter(d => direct.has(d.qn)).each(function (d) {
      const color = categoryOf(d.kind).color
      d3.select(this).interrupt()
        .attr("fill-opacity", 1).attr("stroke-width", 3)
        .attr("r", nodeRadius(d.degree) * 2.1)
        .style("filter", `drop-shadow(0 0 10px ${color})`)
        .transition().delay(delay).duration(dur).ease(d3.easeCubicOut)
        .attr("fill-opacity", 0.35).attr("stroke-width", 1.5)
        .attr("r", nodeRadius(d.degree))
        .style("filter", null)
    })
    dots.filter(d => !direct.has(d.qn) && cats.has(categoryOf(d.kind).id)).each(function (d) {
      d3.select(this).interrupt()
        .attr("fill-opacity", 0.8).attr("stroke-width", 2)
        .transition().delay(delay).duration(dur).ease(d3.easeCubicOut)
        .attr("fill-opacity", 0.35).attr("stroke-width", 1.5)
    })
  }

  // On a sparse region the watermark may be the only thing standing there, so
  // it gets the same slow decay rather than a short CSS blink.
  cats.forEach(catId => {
    const g = document.querySelector(`[data-label-cat="${catId}"]`)
    if (!g) return
    const texts = d3.select(g).selectAll("text")
    texts.interrupt()
      .attr("fill-opacity", (_, i) => (i === 0 ? 0.3 : 0.85))
      .transition().delay(delay).duration(dur).ease(d3.easeCubicOut)
      .attr("fill-opacity", (_, i) => (i === 0 ? 0.05 : 0.55))
  })
}


// recordHits/recentHitCount back the HUD's "N hits" suffix with a rolling 10s
// window rather than a lifetime total, so the row reads as "is the stream
// active right now", not a counter that only ever climbs.
function recordHits(n) {
  const now = Date.now()
  for (let i = 0; i < n; i++) hitTimestamps.push(now)
  updateStreamHud()
}
function recentHitCount() {
  const cutoff = Date.now() - HIT_WINDOW_MS
  hitTimestamps = hitTimestamps.filter(t => t >= cutoff)
  return hitTimestamps.length
}

// updateStreamHud appends the live-stream row through the same low-contrast
// idiom as #hudGraph/#hudSearch (a plain label+value div — #hud's existing CSS
// already styles any div/.label inside it), via its own element and function
// rather than folding into updateHud()'s counts-shaped row list, so this never
// has to fabricate a fake graph `counts` object just to trigger a render.
function updateStreamHud() {
  const el = document.getElementById("hudStream")
  if (!el) return
  const n = recentHitCount()
  const state = streamState === "live" ? "live" : streamState === "retrying" ? "retrying…" : "connecting…"
  const suffix = n ? " · " + n + " hit" + (n === 1 ? "" : "s") : ""
  el.innerHTML = `<div><span class="label">stream </span><span>${esc(state + suffix)}</span></div>`
}

connectStream()

// ── Boot ──────────────────────────────────────────────────────────────────────
async function reload() {
  statusEl.textContent = "Loading graph…"; statusEl.style.display = ""
  try {
    DUMP = await loadGraph()
    if (!DUMP || !Array.isArray(DUMP.nodes) || DUMP.nodes.length === 0) {
      statusEl.textContent = "This graph is empty — nothing indexed yet."
      statusEl.style.display = ""
      svg.selectAll("*").remove()
      updateHud({ drawnNodes: 0, totalNodes: 0, drawnEdges: 0, totalEdges: 0, byCategory: {} })
      return
    }
    statusEl.style.display = "none"
    build()
  } catch (e) {
    statusEl.textContent = "Failed to load graph: " + e.message
    statusEl.style.display = ""
  }
}
async function boot() {
  await loadVersion()
  await populateProjects()
  restorePanels()
  await reload()
  window.addEventListener("resize", () => build())
  refreshMetrics()
  setInterval(refreshMetrics, 5000)
}
// In a host, give the ui/initialize handshake a moment; either way boot once.
// (loadGraph uses the bridge when inHost, else fetch — so booting on the fallback
// timer is safe even if the handshake never arrives.)
if (inHost) { setTimeout(boot, 500) } else { boot() }
</script>
</body>
