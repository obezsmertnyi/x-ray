version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /adapters/adk
    schedule: {interval: weekly}
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
