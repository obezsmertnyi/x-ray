# adapters/adk is a nested module that replaces the root module with ../.., which Dependabot
# cannot resolve on its own; it follows the root module's versions.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
    # eslint 10 breaks eslint-plugin-react, which eslint-config-next bundles; wait for it.
    ignore:
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # React 18 to 19 is a migration of its own, not a routine bump.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
    groups:
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
