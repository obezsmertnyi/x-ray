name: Release

on:
  push:
    tags:
    - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v2.0.0)'
        required: true

jobs:
  push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ko
      uses: ko-build/setup-ko@v0.7

    - name: Compute VERSION
      id: ver
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif echo "$GITHUB_REF" | grep -q "refs/tags/"; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          # vX.Y.Z-N-gSHA once a tag exists; before the first tag a SemVer-valid
          # v0.0.0-N-gSHA, so the chart version is always valid.
          VERSION="$(git describe --tags --match 'v*' 2>/dev/null || echo "v0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short HEAD)")"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build and push image
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}/xray
        VERSION: ${{ steps.ver.outputs.version }}
      run: make push

  push-parser:
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ko
      uses: ko-build/setup-ko@v0.7

    # The same ./cmd/xray built with cgo, so it can parse (xray graph serve|
    # snapshot). ko builds it on this linux/amd64 runner with its C compiler and
    # publishes it as a tag of the one xray image repository.
    - name: Build and push parser image
      env:
        REGISTRY: ghcr.io/${{ github.repository_owner }}/xray
        VERSION: ${{ needs.push-image.outputs.version }}
      run: make graph-push

  push-chart:
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.push-image.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/xray
      CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.2

    # The chart points at the image this run pushed.
    - name: Stamp chart version and image
      run: |
        sed -i "s/^version:.*/version: ${VERSION#v}/" charts/xray/Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/xray/Chart.yaml
        sed -i "s#^  repository:.*#  repository: ${IMAGE}#" charts/xray/values.yaml
        sed -i "s/^  tag:.*/  tag: \"${VERSION}\"/" charts/xray/values.yaml

    - name: Stamp the graph chart
      run: |
        sed -i "s/^version:.*/version: ${VERSION#v}/" charts/xray-graph/Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/xray-graph/Chart.yaml

    - name: Lint charts
      run: |
        helm lint charts/xray charts/xray-graph

    - name: Package and push charts (OCI)
      run: |
        for c in xray xray-graph; do
          helm package "charts/$c" --destination dist
          helm push "dist/$c-${VERSION#v}.tgz" "${CHART_OCI}"
        done

  release:
    needs: [push-image, push-parser, push-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        generate_release_notes: true
