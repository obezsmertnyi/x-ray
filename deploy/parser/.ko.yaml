# ko config for the parser image: cmd/xray built with CGO, so the Tree-sitter
# grammars are linked in and `xray graph serve|snapshot|dump <dir>` can parse.
# The binary links glibc dynamically, so the base is glibc, not static.
#
#   KO_CONFIG_PATH=deploy/parser KO_DOCKER_REPO=ghcr.io/<owner>/xray \
#     ko build ./cmd/xray --bare --platform=linux/amd64 --tags=<version>-parser
#
# Build on a linux/amd64 host with a C compiler; ko does not cross-compile C.
defaultBaseImage: cgr.dev/chainguard/glibc-dynamic:latest
builds:
- id: xray-parser
  main: ./cmd/xray
  env:
  - CGO_ENABLED=1
  ldflags:
  - -s -w
  - -X github.com/triageagent-dev/x-ray/v2/internal/version.Version={{.Env.VERSION}}
  - -X github.com/triageagent-dev/x-ray/v2/internal/version.GitCommit={{.Env.GIT_COMMIT}}
  - -X github.com/triageagent-dev/x-ray/v2/internal/version.BuildDate={{.Env.BUILD_DATE}}
  kodata: false
